name: test

on:
  push:
    branches: [main, dev, feat-phosphogypsum-bot]
  pull_request:
    branches: [main, dev, feat-phosphogypsum-bot]
  workflow_dispatch:

jobs:
  test:
    name: Unit & Agent Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,ai,docling,stochastic_dynamics,chemicals]"

      - name: Check version synchronization
        run: |
          python scripts/check_version_sync.py

      - name: Run unit & agent test suite
        run: |
          pytest tests/ -v -k "not integration and not slow"

  stochastic-dynamics-smoke:
    name: Stochastic Dynamics Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev,stochastic_dynamics]"

      - name: Run stochastic dynamics smoke tests
        run: |
          pytest tests/test_stochastic_dynamics_baseline.py tests/test_stochastic_dynamics_pinn.py tests/test_stochastic_dynamics_vae.py -v
